name: fixsafe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the uploaded copy
        run: |
          set -e
          F=$(ls [0-9]*-index.html 2>/dev/null | head -1 || true); if [ -z "$F" ]; then echo "nothing to do"; exit 0; fi
          git mv -f "$F" index.html
          git rm -f --ignore-unmatch .github/workflows/*fixsafe.yml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Fix iPhone safe-area: status bar cover, Dark mode button overlap, bottom spacing"
          git push
