<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Money"><title>Money</title>
<style>:root{--bg:#000;--tx:#f5f5f5;--cd:#121212;--in:#262626;--nv:#000;--mu:#a8a8a8;--bd:#262626}[data-t=light]{--bg:#f2f4f8;--tx:#111827;--cd:#fff;--in:#e6e9f2;--nv:#fff;--mu:#667085;--bd:#e3e6ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,sans-serif;padding:env(safe-area-inset-top) 14px 90px}h2{margin:16px 0 8px}.c{background:var(--cd);border-radius:14px;padding:12px;margin:10px 0}input,select,button{width:100%;padding:12px;margin:4px 0;border-radius:10px;border:0;background:var(--in);color:var(--tx);font-size:16px}button{background:#4f7cff;color:#fff;font-weight:600}.r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.g{color:#22c55e}.b{color:#ef4444}small{color:var(--mu)}.x{background:none;width:auto;padding:4px 8px;color:var(--mu)}.n{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--nv);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.n button{background:none;color:var(--mu);font-size:14px}.n .a{color:var(--tx)}.big{font-size:28px;font-weight:700}.ch{width:auto;display:inline-block;margin:3px;padding:8px 14px;background:var(--in);color:var(--tx);font-weight:500}.th{width:auto;float:right;padding:6px 14px;margin-top:14px;background:var(--in);color:var(--tx)}</style></head><body><div id=app></div><div class=n><button onclick="go(0)" id=n0>Home</button><button onclick="go(1)" id=n1>Spend</button><button onclick="go(2)" id=n2>Owed</button></div>
<script>
var D=JSON.parse(localStorage.getItem('m')||'{"s":[],"o":[]}'),P=0;D.p=D.p||[];var T=localStorage.getItem('t')||'dark';
function sv(){localStorage.setItem('m',JSON.stringify(D));R()}
function go(p){P=p;R()}
function f(n){return '\u20b9'+Number(n).toLocaleString('en-IN')}
function ym(d){return d.slice(0,7)}
function tg(){T=T=='dark'?'light':'dark';localStorage.setItem('t',T);R()}
function R(){document.documentElement.setAttribute('data-t',T);var h='',now=new Date().toISOString().slice(0,10);
for(var i=0;i<3;i++)document.getElementById('n'+i).className=i==P?'a':'';
if(P==0){var mo=D.s.filter(x=>ym(x.d)==ym(now)),tm=mo.reduce((a,x)=>a+x.a,0),td=D.s.filter(x=>x.d==now).reduce((a,x)=>a+x.a,0),ow=D.o.filter(x=>!x.p&&x.k=='they').reduce((a,x)=>a+x.a,0),oy=D.o.filter(x=>!x.p&&x.k=='me').reduce((a,x)=>a+x.a,0);
h+='<button class=th onclick=tg()>'+(T=='dark'?'Light':'Dark')+' mode</button><h2>Overview</h2><div class=c><small>Spent today</small><div class=big>'+f(td)+'</div></div><div class=c><small>Spent this month</small><div class=big>'+f(tm)+'</div></div><div class=c><small>Owed to you</small><div class="big g">'+f(ow)+'</div></div><div class=c><small>You owe</small><div class="big b">'+f(oy)+'</div></div>';
var cat={};mo.forEach(x=>cat[x.c]=(cat[x.c]||0)+x.a);var ks=Object.keys(cat).sort((a,b)=>cat[b]-cat[a]);
h+='<h2>This month by category</h2><div class=c>';if(!ks.length)h+='<small>Nothing yet</small>';ks.forEach(k=>{var w=Math.round(cat[k]/tm*100);h+='<div style="margin:8px 0"><div class=r style="border:0;padding:0"><span>'+k+'</span><span>'+f(cat[k])+'</span></div><div style="background:var(--in);border-radius:6px;height:8px"><div style="background:#4f7cff;width:'+w+'%;height:8px;border-radius:6px"></div></div></div>'});h+='</div><h2>Backup</h2><div class=c><button onclick=bk()>Copy backup</button><button onclick=rs() style="background:var(--in);color:var(--tx)">Restore from backup</button><small>Copy backup, then paste it into Notes to keep it safe.</small></div>'}
if(P==1){h+='<h2>Add spending</h2><div class=c><input id=a type=number inputmode=decimal placeholder="Amount"><input id=w placeholder="Where (e.g. Canteen)"><select id=c><option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Fun</option><option>Study</option><option>Other</option></select><input id=d type=date value="'+now+'"><button onclick=addS()>Add</button></div><h2>History</h2><div class=c>';
D.s.slice().reverse().forEach(x=>{h+='<div class=r><div>'+x.w+' <small>'+x.c+' \u00b7 '+x.d+'</small></div><div>'+f(x.a)+'<button class=x onclick=delS('+x.i+')>\u2715</button></div></div>'});if(!D.s.length)h+='<small>Nothing yet</small>';h+='</div>'}
if(P==2){h+='<h2>Add</h2><div class=c><select id=k><option value=they>Someone owes me</option><option value=me>I owe someone</option></select><input id=a type=number inputmode=decimal placeholder="Amount"><input id=w placeholder="Name"><input id=nt placeholder="Note (optional)"><button onclick=addO()>Add</button></div><h2>Regular people</h2><div class=c><small>Tap a name to fill it in</small><div>';D.p.forEach((n,i)=>{h+='<button class=ch onclick=pick('+i+')>'+n+'</button>'});h+='</div><input id=pn placeholder="New regular name"><button onclick=addP()>Save name</button>';D.p.forEach((n,i)=>{h+='<div class=r><span>'+n+'</span><button class=x onclick=delP('+i+')>\u2715</button></div>'});h+='</div>';
['they','me'].forEach(k=>{h+='<h2>'+(k=='they'?'Owed to you':'You owe')+'</h2><div class=c>';var l=D.o.filter(x=>x.k==k&&!x.p);l.forEach(x=>{h+='<div class=r><div>'+x.w+' <small>'+(x.n||'')+'</small></div><div class="'+(k=='they'?'g':'b')+'">'+f(x.a)+'<button class=x onclick=pay('+x.i+')>Paid</button><button class=x onclick=delO('+x.i+')>\u2715</button></div></div>'});if(!l.length)h+='<small>None</small>';h+='</div>'})}
document.getElementById('app').innerHTML=h}
function addS(){var a=+document.getElementById('a').value,w=document.getElementById('w').value||'-';if(!a)return;D.s.push({i:Date.now(),a:a,w:w,c:document.getElementById('c').value,d:document.getElementById('d').value});sv()}
function delS(i){D.s=D.s.filter(x=>x.i!=i);sv()}
function addO(){var a=+document.getElementById('a').value,w=document.getElementById('w').value;if(!a||!w)return;D.o.push({i:Date.now(),a:a,w:w,n:document.getElementById('nt').value,k:document.getElementById('k').value,p:0});sv()}
function bk(){var t=JSON.stringify(D);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Backup copied. Paste it in Notes.')).catch(()=>prompt('Copy this text:',t))}
function rs(){var t=prompt('Paste your backup here');if(!t)return;try{var x=JSON.parse(t);if(!x.s||!x.o)throw 0;D=x;D.p=D.p||[];sv();alert('Restored')}catch(e){alert('That backup text is not valid')}}
function pick(i){document.getElementById('w').value=D.p[i]}
function addP(){var n=document.getElementById('pn').value.trim();if(!n)return;D.p.push(n);sv()}
function delP(i){D.p.splice(i,1);sv()}
function pay(i){D.o.forEach(x=>{if(x.i==i)x.p=1});sv()}
function delO(i){D.o=D.o.filter(x=>x.i!=i);sv()}
R()
</script></body></html>
