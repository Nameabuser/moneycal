<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Money"><title>Money</title>
<style>:root{--bg:#000;--tx:#f5f5f5;--cd:#121212;--in:#262626;--nv:#000;--mu:#a8a8a8;--bd:#262626}[data-t=light]{--bg:#f2f4f8;--tx:#111827;--cd:#fff;--in:#e6e9f2;--nv:#fff;--mu:#667085;--bd:#e3e6ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,sans-serif;padding:env(safe-area-inset-top) 14px 90px}h2{margin:16px 0 8px}.c{background:var(--cd);border-radius:14px;padding:12px;margin:10px 0}input,select,button{width:100%;padding:12px;margin:4px 0;border-radius:10px;border:0;background:var(--in);color:var(--tx);font-size:16px}button{background:#4f7cff;color:#fff;font-weight:600}.r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.g{color:#22c55e}.b{color:#ef4444}small{color:var(--mu)}.x{background:none;width:auto;padding:4px 8px;color:var(--mu)}.n{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--nv);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.n button{background:none;color:var(--mu);font-size:14px}.n .a{color:var(--tx)}input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:center;height:46px}.big{font-size:28px;font-weight:700}.ch{width:auto;display:inline-block;margin:3px;padding:8px 14px;background:var(--in);color:var(--tx);font-weight:500}.th{width:auto;float:right;padding:6px 14px;margin-top:14px;background:var(--in);color:var(--tx)}</style></head><body><div id=app></div><div class=n><button onclick="go(0)" id=n0>Home</button><button onclick="go(1)" id=n1>Spend</button><button onclick="go(3)" id=n3>Earn</button><button onclick="go(2)" id=n2>Owed</button></div>
<script>
function data(x){
var obj=v=>v!==null&&typeof v=='object'&&!Array.isArray(v),num=v=>typeof v=='number'&&Number.isFinite(v),str=v=>typeof v=='string';
if(!obj(x)||!Array.isArray(x.s)||!Array.isArray(x.o)||(x.p!==undefined&&(!Array.isArray(x.p)||!x.p.every(str))))throw new Error('Invalid backup');
if(!x.s.every(v=>obj(v)&&num(v.i)&&num(v.a)&&str(v.w)&&str(v.c)&&str(v.d)&&(v.d==''||(/^\d{4}-\d{2}-\d{2}$/.test(v.d)&&!isNaN(Date.parse(v.d))&&new Date(v.d).toISOString().slice(0,10)==v.d))))throw new Error('Invalid spending');
if(!x.o.every(v=>obj(v)&&num(v.i)&&num(v.a)&&str(v.w)&&(v.n===undefined||str(v.n))&&(v.k=='they'||v.k=='me')&&(v.p===0||v.p===1||typeof v.p=='boolean')))throw new Error('Invalid debt');
if(x.e!==undefined&&(!Array.isArray(x.e)||!x.e.every(v=>obj(v)&&num(v.i)&&num(v.a)&&v.a>0&&str(v.w)&&str(v.c)&&str(v.d)&&(v.d==''||(/^\d{4}-\d{2}-\d{2}$/.test(v.d)&&!isNaN(Date.parse(v.d))&&new Date(v.d).toISOString().slice(0,10)==v.d)))))throw new Error('Invalid earnings');
return {s:x.s,o:x.o,p:x.p===undefined?[]:x.p,e:x.e===undefined?[]:x.e}
}
var D={s:[],o:[],p:[],e:[]},P=0,loadFailed=false;var T='dark';
try{var saved=localStorage.getItem('m');if(saved!==null)D=data(JSON.parse(saved));T=localStorage.getItem('t')||'dark'}catch(e){loadFailed=true;alert('Saved data could not be loaded. It has not been changed. Restore a valid backup before making changes.')}
function sv(){if(loadFailed){alert('Saved data is protected. Restore a valid backup before making changes.');return}localStorage.setItem('m',JSON.stringify(D));R()}
function go(p){P=p;R()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function f(n){return '\u20b9'+Number(n).toLocaleString('en-IN')}
function ym(d){return d.slice(0,7)}
function tg(){T=T=='dark'?'light':'dark';localStorage.setItem('t',T);R()}
function R(){document.documentElement.setAttribute('data-t',T);var h='',now=new Date().toISOString().slice(0,10);
for(var i=0;i<4;i++)document.getElementById('n'+i).className=i==P?'a':'';
if(P==0){var mo=D.s.filter(x=>ym(x.d)==ym(now)),tm=mo.reduce((a,x)=>a+x.a,0),ow=D.o.filter(x=>!x.p&&x.k=='they').reduce((a,x)=>a+x.a,0),oy=D.o.filter(x=>!x.p&&x.k=='me').reduce((a,x)=>a+x.a,0);
var em=D.e.filter(x=>ym(x.d)==ym(now)).reduce((a,x)=>a+x.a,0),ed=D.e.filter(x=>x.d==now).reduce((a,x)=>a+x.a,0);
h+='<button class=th onclick=tg()>'+(T=='dark'?'Light':'Dark')+' mode</button><h2>Overview</h2><div class=c><small>Earned today</small><div class="big g">'+f(ed)+'</div></div><div class=c><small>Earned this month</small><div class="big g">'+f(em)+'</div></div><div class=c><small>Spent this month</small><div class=big>'+f(tm)+'</div></div><div class=c><small>Owed to you</small><div class="big g">'+f(ow)+'</div></div><div class=c><small>You owe</small><div class="big b">'+f(oy)+'</div></div>';
var cat=Object.create(null);mo.forEach(x=>cat[x.c]=(cat[x.c]||0)+x.a);var ks=Object.keys(cat).sort((a,b)=>cat[b]-cat[a]);
h+='<h2>This month by category</h2><div class=c>';if(!ks.length)h+='<small>Nothing yet</small>';ks.forEach(k=>{var w=Math.round(cat[k]/tm*100);h+='<div style="margin:8px 0"><div class=r style="border:0;padding:0"><span>'+esc(k)+'</span><span>'+f(cat[k])+'</span></div><div style="background:var(--in);border-radius:6px;height:8px"><div style="background:#4f7cff;width:'+w+'%;height:8px;border-radius:6px"></div></div></div>'});h+='</div><h2>Backup</h2><div class=c><button onclick=bk()>Copy backup</button><button onclick=rs() style="background:var(--in);color:var(--tx)">Restore from backup</button><small>Copy backup, then paste it into Notes to keep it safe.</small></div>'}
if(P==1){h+='<h2>Add spending</h2><div class=c><input id=a type=number inputmode=decimal placeholder="Amount"><input id=w placeholder="Where (e.g. Canteen)"><select id=c><option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Fun</option><option>Study</option><option>Other</option></select><input id=d type=date value="'+now+'"><button onclick=addS()>Add</button></div><h2>History</h2><div class=c>';
D.s.slice().reverse().forEach(x=>{h+='<div class=r><div>'+esc(x.w)+' <small>'+esc(x.c)+' \u00b7 '+x.d+'</small></div><div>'+f(x.a)+'<button class=x onclick=delS('+x.i+')>\u2715</button></div></div>'});if(!D.s.length)h+='<small>Nothing yet</small>';h+='</div>'}
if(P==3){h+='<h2>Add earnings</h2><div class=c><input id=a type=number inputmode=decimal placeholder="Amount"><input id=w placeholder="From (e.g. Work)"><select id=c><option>Salary</option><option>Pocket money</option><option>Gift</option><option>Freelance</option><option>Other</option></select><input id=d type=date value="'+now+'"><button onclick=addE()>Add</button></div><h2>History</h2><div class=c>';
D.e.slice().reverse().forEach(x=>{h+='<div class=r><div>'+esc(x.w)+' <small>'+esc(x.c)+' \u00b7 '+x.d+'</small></div><div class=g>'+f(x.a)+'<button class=x onclick=delE('+x.i+')>\u2715</button></div></div>'});if(!D.e.length)h+='<small>Nothing yet</small>';h+='</div>'}
if(P==2){h+='<h2>Add</h2><div class=c><select id=k><option value=they>Someone owes me</option><option value=me>I owe someone</option></select><input id=a type=number inputmode=decimal placeholder="Amount"><input id=w placeholder="Name"><input id=nt placeholder="Note (optional)"><button onclick=addO()>Add</button></div><h2>Regular people</h2><div class=c><small>Tap a name to fill it in</small><div>';D.p.forEach((n,i)=>{h+='<button class=ch onclick=pick('+i+')>'+esc(n)+'</button>'});h+='</div><input id=pn placeholder="New regular name"><button onclick=addP()>Save name</button>';D.p.forEach((n,i)=>{h+='<div class=r><span>'+esc(n)+'</span><button class=x onclick=delP('+i+')>\u2715</button></div>'});h+='</div>';
['they','me'].forEach(k=>{h+='<h2>'+(k=='they'?'Owed to you':'You owe')+'</h2><div class=c>';var l=D.o.filter(x=>x.k==k&&!x.p);l.forEach(x=>{h+='<div class=r><div>'+esc(x.w)+' <small>'+esc(x.n||'')+'</small></div><div class="'+(k=='they'?'g':'b')+'">'+f(x.a)+'<button class=x onclick=pay('+x.i+')>Paid</button><button class=x onclick=delO('+x.i+')>\u2715</button></div></div>'});if(!l.length)h+='<small>None</small>';h+='</div>'})}
document.getElementById('app').innerHTML=h}
function saveE(e){if(loadFailed){alert('Saved data is protected. Restore a valid backup before making changes.');return}var x={s:D.s,o:D.o,p:D.p,e:e};try{localStorage.setItem('m',JSON.stringify(x))}catch(err){alert('Could not save earnings. Your current data has not been changed.');return}D=x;R()}
function addE(){var a=+document.getElementById('a').value,w=document.getElementById('w').value||'-';if(!Number.isFinite(a)||a<=0)return;var x={i:Date.now(),a:a,w:w,c:document.getElementById('c').value,d:document.getElementById('d').value};try{data({s:D.s,o:D.o,p:D.p,e:[x]})}catch(err){alert('Enter a valid date.');return}saveE(D.e.concat(x))}
function delE(i){saveE(D.e.filter(x=>x.i!=i))}
function addS(){var a=+document.getElementById('a').value,w=document.getElementById('w').value||'-';if(!a)return;D.s.push({i:Date.now(),a:a,w:w,c:document.getElementById('c').value,d:document.getElementById('d').value});sv()}
function delS(i){D.s=D.s.filter(x=>x.i!=i);sv()}
function addO(){var a=+document.getElementById('a').value,w=document.getElementById('w').value;if(!a||!w)return;D.o.push({i:Date.now(),a:a,w:w,n:document.getElementById('nt').value,k:document.getElementById('k').value,p:0});sv()}
function bk(){if(loadFailed){alert('Saved data could not be loaded. Do not replace your existing backup.');return}var t=JSON.stringify(D);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Backup copied. Paste it in Notes.')).catch(()=>prompt('Copy this text:',t))}
function rs(){var t=prompt('Paste your backup here');if(!t)return;var x;try{x=data(JSON.parse(t))}catch(e){alert('That backup text is not valid. Your saved data has not been changed.');return}
if(!confirm('Replace your current data with this backup?'))return;
try{localStorage.setItem('m',JSON.stringify(x))}catch(e){alert('Could not save the backup. Your current data has not been changed.');return}
D=x;loadFailed=false;R();alert('Restored')}
function pick(i){document.getElementById('w').value=D.p[i]}
function addP(){var n=document.getElementById('pn').value.trim();if(!n)return;D.p.push(n);sv()}
function delP(i){D.p.splice(i,1);sv()}
function pay(i){D.o.forEach(x=>{if(x.i==i)x.p=1});sv()}
function delO(i){D.o=D.o.filter(x=>x.i!=i);sv()}
R()
</script></body></html>
